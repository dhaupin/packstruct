name: corpus
# Reciprocal corpus lane (dhaupin/packstruct#3): run OUR linter over the
# crashtest repo's shipped packs at a pinned rev - the live corpus, not
# synthetic fixtures. Receipt for this lane ships in the same commit
# (labs/corpus-receipt.md), per the house law.
#
# Zero runtime dependencies: pinned-clone via actions/checkout, zero-dep CLI,
# nothing imported from the crashtest codebase.
on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  corpus:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 20 }

      # The audited corpus tree: crashtest tag v1.3.0
      # (873828743d7cc715893619e6295cb0a81251a439) - the tag live on npm.
      # Bump pin + labs/corpus-receipt.md together, never silently.
      - name: Check out the crashtest corpus at the audited pin
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: dhaupin/crashtest
          ref: v1.3.0
          path: corpus-crashtest

      - name: Lint the corpus manifests (9 packs, expect clean)
        run: node bin/cli.mjs lint corpus-crashtest/packs

      # Deep probe over the SAME pinned tree: entries imported once
      # in-process, ids censused. Receipt (labs/corpus-receipt.md v1.3.0
      # run): 9/9 modules probed, 47 ids, zero violations - the crashtest
      # id space independently reproduced through our own linter.
      - name: Deep-probe the corpus (entry import + id census, expect clean)
        run: node bin/cli.mjs lint corpus-crashtest/packs --deep

      # Host-library census: the pack ids vs the built-in scenario library
      # inside the same pinned tree. Receipt (labs/corpus-receipt.md v1.3.0
      # run): 66 library ids seeded (module + attack + step names; the
      # attack-only count is smaller - taxonomic difference, not a
      # contradiction), zero collisions, exit 0.
      - name: Census pack ids against the built-in library (expect clean)
        run: node bin/cli.mjs lint corpus-crashtest/packs --deep --against corpus-crashtest/src/scenarios/library
