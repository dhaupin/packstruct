name: test
on:
  push: { branches: [main, staging] }
  pull_request: { branches: [main, staging] }
  # Re-run surface: canceled-by-external-agent runs should be re-triggerable
  # without a noise commit on the fold trail.
  workflow_dispatch:
jobs:
  test:
    # Bounded: the QC hang class showed up as an invisible forever-run; a
    # stalled runner dies HERE (10 min) with its phase markers in the log
    # instead of hanging silently.
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install --no-fund --no-audit
      - run: npm test
      # The battery (packstruct#33): docs gates + the shipped pack's deep
      # lint + the 8/8 conformance audit. The SAME `npm run check` is the
      # prepublishOnly gate, so a red battery blocks a PR and a publish.
      - name: check battery
        run: npm run check
      - name: lint the repo's own conformance fixtures through the CLI (both ways)
        run: |
          node bin/cli.mjs lint test/fixtures/good/packs
          if node bin/cli.mjs lint test/fixtures/bad/packs >/dev/null 2>&1; then
            echo "lint should have failed on broken fixtures"; exit 1
          fi
      # The refusal matrix must stay honest AND in sync. `--check` regenerates
      # in memory and diffs against the committed receipt, exiting 1 on any
      # delta - so a linter change that flips a row (or grows stricter than
      # the SPEC promises) fails here instead of shipping a stale matrix green.
      # It is also a leg of `npm run check`, the prepublishOnly gate.
      - name: Verify the refusal matrix stays honest and in sync (packstruct#3)
        run: node scripts/gen-refusal-matrix.mjs --check
