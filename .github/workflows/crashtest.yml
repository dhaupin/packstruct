name: crashtest
on:
  push: { branches: [main, staging] }
  pull_request: { branches: [main, staging] }
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 20 }
      - run: npm install --no-fund --no-audit
      - run: npm test
      # npm registry pin (the pack contracts target the stable v1.3.0
      # harness surface, 8738287 - the tag live on npm). Bump pin + receipt
      # together.
      - name: Install crashtest
        run: npm install --no-save --no-audit --no-fund crashtest@1.3.0
      - name: Run the lint-shapes pack
        run: npx crashtest run
