name: crashtest
on:
  push: { branches: [main] }
  pull_request: { branches: [main] }
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install --no-fund --no-audit
      - run: npm test
      # Pinned to the same rev freestruct's docs dogfood pins (the pack
      # contracts target the stable v1.0.0 harness surface).
      - name: Install crashtest
        run: npm install --no-save --no-audit --no-fund github:dhaupin/crashtest#dc80a7c7a42e58a532b8ad624b79de2742d1ccbb
      - name: Run the lint-shapes pack
        run: npx crashtest run
