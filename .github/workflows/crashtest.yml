name: crashtest
on:
  push: { branches: [main] }
  pull_request: { branches: [main] }
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run:
    timeout-minutes: 10
    # Pinned against the ubuntu-latest -> Ubuntu 26 migration (began
    # 2026-10-19): the new image's orphan-process teardown SIGTERM-kills
    # steps mid-flight (exit 143 + "Cleaning up orphan processes") - this
    # lane has eaten kills in three different steps on the new image while
    # the same steps pass on 24.04 and local. Un-pin when 26 is stable.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install --no-fund --no-audit
      - run: npm test
      # npm registry pin (the pack contracts target the stable v1.0.0
      # harness surface). Bump to crashtest@1.0.1 when it publishes.
      - name: Install crashtest
        run: npm install --no-save --no-audit --no-fund crashtest@1.0.0
      - name: Run the lint-shapes pack
        run: npx crashtest run
